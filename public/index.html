<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kaleo</title>

  <!-- PWA Setup -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/kaleo.svg" />
  <meta name="theme-color" content="#0B1020" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div id="joinScreen" class="screen">
    <div class="card">
      <img src="/kaleo.svg" alt="Kaleo Logo" width="96" height="96" style="margin: 0 auto 15px; display: block;" />
      <p class="tagline">Called. Connected.</p>
      <label>Your Kaleo ID</label>
      <div style="display:flex; gap:8px; margin-bottom:15px;">
        <input id="myId" readonly style="text-align:center;" />
        <button id="copyBtn" type="button">📋</button>
      </div>
      <button id="registerBtn">Enter Kaleo</button>
    </div>
  </div>

  <div id="callScreen" class="screen" style="display:none;">
    <header class="app-header">
      <span>Kaleo</span>
      <span id="statusText">idle</span>
    </header>

    <main class="main">
      <div id="dialPanel" class="dial-panel">
        <h2>Ready to call</h2>
        <input id="peerName" placeholder="Paste friend's ID" style="text-align:center; text-transform:uppercase;" />
        <div class="btn-row">
          <button id="videoCallBtn">📹 Video</button>
          <button id="voiceCallBtn" style="background:#22C55E;">📞 Voice</button>
        </div>

        <!-- Call History List -->
        <div style="margin-top:20px;">
          <p style="font-size:11px; color:#888; text-transform:uppercase; margin-bottom:8px;">Recent Calls</p>
          <div id="historyList"></div>
        </div>

        <p style="margin-top:15px; font-size:12px; color:#666; text-align:center;">Your ID: <strong
            id="displayMyId"></strong></p>
      </div>

      <div id="videoGrid" class="video-grid" style="display:none;">
        <div class="video-tile">
          <video id="localVideo" autoplay muted playsinline></video>
          <span class="label">You</span>
        </div>
        <div class="video-tile">
          <video id="remoteVideo" autoplay playsinline></video>
          <span class="label" id="remoteLabel">Peer</span>
        </div>
      </div>
    </main>

    <footer id="controlsBar" class="controls" style="display:none;">
      <button id="muteBtn">🎤</button>
      <button id="camBtn">📹</button>
      <button id="hangupBtn" style="background:#EF4444;">End</button>
    </footer>
  </div>

  <!-- Ringtone: plays on incoming call -->
  <audio id="ringtone" loop preload="auto">
    <source src="https://actions.google.com/sounds/v1/alarms/phone_alerts_and_rings.ogg" type="audio/ogg">
  </audio>

  <div id="incomingModal" class="modal" style="display:none;">
    <div class="card">
      <h2>Incoming Call</h2>
      <p id="callerName" style="font-size:20px; margin:15px 0;"></p>
      <div style="display:flex; gap:10px;">
        <button id="declineBtn" style="background:#EF4444; flex:1;">Decline</button>
        <button id="acceptBtn" style="background:#22C55E; flex:1;">Accept</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>

  <!-- Register Service Worker for PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/service-worker.js').catch(() => { });
    }
  </script>
</body>

</html>
